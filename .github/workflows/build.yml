name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Create Android Project Structure
        run: |
          mkdir -p app/src/main/java/com/example/pooloverlay
          mkdir -p app/src/main/res

      - name: Move Files to Structure
        run: |
          if [ -f MainActivity.kt ]; then mv MainActivity.kt app/src/main/java/com/example/pooloverlay/; fi
          if [ -f FloatingService.kt ]; then mv FloatingService.kt app/src/main/java/com/example/pooloverlay/; fi
          if [ -f OverlayView.kt ]; then mv OverlayView.kt app/src/main/java/com/example/pooloverlay/; fi
          if [ -f AndroidManifest.xml ]; then mv AndroidManifest.xml app/src/main/res/; fi

      - name: Generate Gradle Files
        run: |
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath "com.android.tools.build:gradle:7.4.2"
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.0"
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat << 'EOF' > settings.gradle
          include ':app'
          rootProject.name = "PoolOverlay"
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.example.pooloverlay'
              compileSdk 33
              defaultConfig {
                  applicationId "com.example.pooloverlay"
                  minSdk 24
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.9.0'
              implementation 'androidx.appcompat:appcompat:1.6.0'
              implementation 'com.google.android.material:material:1.8.0'
          }
          EOF
          gradle wrapper --gradle-version 7.5

      - name: Build APK with Gradle
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
